<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820"><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="black"/></marker></defs><rect width="1400" height="820" fill="white"/><text x="700" y="52.8" text-anchor="middle" font-family="Times New Roman" font-size="36" font-weight="bold">PACKET WALK — PHIÊN TCP NỘI BỘ M3.4B</text><rect x="10" y="95" width="280" height="95" fill="white" stroke="black" stroke-width="2"/><text x="150" y="135.5" text-anchor="middle" font-family="Times New Roman" font-size="28" font-weight="bold">Client .40.100</text><text x="150" y="166.3" text-anchor="middle" font-family="Times New Roman" font-size="28" font-weight="bold">Gateway VIP .40.1</text><line x1="150" y1="195" x2="150" y2="685" stroke="gray"/><rect x="360" y="95" width="280" height="95" fill="white" stroke="black" stroke-width="2"/><text x="500" y="150.9" text-anchor="middle" font-family="Times New Roman" font-size="28" font-weight="bold">Core L2</text><line x1="500" y1="195" x2="500" y2="685" stroke="gray"/><rect x="710" y="95" width="280" height="95" fill="white" stroke="black" stroke-width="2"/><text x="850" y="135.5" text-anchor="middle" font-family="Times New Roman" font-size="28" font-weight="bold">OPNsense</text><text x="850" y="166.3" text-anchor="middle" font-family="Times New Roman" font-size="28" font-weight="bold">VIP .40.1 / .30.1</text><line x1="850" y1="195" x2="850" y2="685" stroke="gray"/><rect x="1080" y="95" width="280" height="95" fill="white" stroke="black" stroke-width="2"/><text x="1220" y="135.5" text-anchor="middle" font-family="Times New Roman" font-size="28" font-weight="bold">DC .30.10</text><text x="1220" y="166.3" text-anchor="middle" font-family="Times New Roman" font-size="28" font-weight="bold">TCP8000</text><line x1="1220" y1="195" x2="1220" y2="685" stroke="gray"/><path marker-end="url(#arrow)" d="M150,240 L500,240" fill="none" stroke="black" stroke-width="3"/><text x="325" y="225.3" text-anchor="middle" font-family="Times New Roman" font-size="26" font-weight="normal">SYN tới .30.10:8000</text><path marker-end="url(#arrow)" d="M500,300 L850,300" fill="none" stroke="black" stroke-width="3"/><text x="675" y="285.6" text-anchor="middle" font-family="Times New Roman" font-size="27" font-weight="normal">Trunk tag40</text><path marker-end="url(#arrow)" d="M850,360 L500,360" fill="none" stroke="black" stroke-width="3"/><text x="675" y="345" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal">Rule/state; tag30; TTL63</text><path marker-end="url(#arrow)" d="M500,420 L1220,420" fill="none" stroke="black" stroke-width="3"/><text x="910" y="405.6" text-anchor="middle" font-family="Times New Roman" font-size="27" font-weight="normal">Access30 bỏ tag → DC</text><path marker-end="url(#arrow)" d="M1220,480 L500,480" fill="none" stroke="black" stroke-width="3"/><text x="920" y="465.3" text-anchor="middle" font-family="Times New Roman" font-size="26" font-weight="normal">Phản hồi tới VIP .30.1 qua Core</text><path marker-end="url(#arrow)" d="M500,540 L850,540" fill="none" stroke="black" stroke-width="3"/><text x="675" y="525" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal">Trunk tag30 → firewall</text><path marker-end="url(#arrow)" d="M850,600 L500,600" fill="none" stroke="black" stroke-width="3"/><text x="675" y="585" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal">Khớp state; trunk tag40</text><path marker-end="url(#arrow)" d="M500,660 L150,660" fill="none" stroke="black" stroke-width="3"/><text x="325" y="645" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal">Access40 bỏ tag → client</text><text x="700" y="711.25" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal">DC giữ default .30.2; riêng .40.100/32 đi via VIP .30.1.</text><text x="700" y="738.75" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal">Cùng HTTP session qua Secondary; không reconnect, chưa đo zero loss.</text><text x="700" y="786.9" text-anchor="middle" font-family="Times New Roman" font-size="23" font-weight="normal">SƠ ĐỒ TÁI DỰNG THEO HỒ SƠ [63] — KHÔNG PHẢI ẢNH CHỤP THỰC NGHIỆM</text></svg>
