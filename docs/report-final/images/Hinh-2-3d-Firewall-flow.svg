<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820"><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="black"/></marker></defs><rect width="1400" height="820" fill="white"/><text x="700" y="52.8" text-anchor="middle" font-family="Times New Roman" font-size="36" font-weight="bold">FIREWALL CÓ TRẠNG THÁI — SƠ ĐỒ NGUYÊN LÝ</text><rect x="25" y="130" width="290" height="110" fill="white" stroke="black" stroke-width="2"/><text x="170" y="177.5" text-anchor="middle" font-family="Times New Roman" font-size="30" font-weight="bold">Gói tới interface</text><text x="170" y="210.5" text-anchor="middle" font-family="Times New Roman" font-size="30" font-weight="bold">VLAN nguồn</text><rect x="430" y="130" width="300" height="110" fill="white" stroke="black" stroke-width="2"/><text x="580" y="194" text-anchor="middle" font-family="Times New Roman" font-size="30" font-weight="bold">Khớp state hợp lệ?</text><path marker-end="url(#arrow)" d="M315,185 L430,185" fill="none" stroke="black" stroke-width="3"/><rect x="1010" y="130" width="350" height="110" fill="white" stroke="black" stroke-width="2"/><text x="1185" y="194" text-anchor="middle" font-family="Times New Roman" font-size="30" font-weight="bold">Xử lý theo state</text><path marker-end="url(#arrow)" d="M730,185 L1010,185" fill="none" stroke="black" stroke-width="3"/><text x="870" y="155.9" text-anchor="middle" font-family="Times New Roman" font-size="28" font-weight="normal">Có</text><rect x="430" y="350" width="450" height="110" fill="white" stroke="black" stroke-width="2"/><text x="655" y="398" text-anchor="middle" font-family="Times New Roman" font-size="28" font-weight="bold">Kết nối mới: kiểm rule</text><text x="655" y="428.8" text-anchor="middle" font-family="Times New Roman" font-size="28" font-weight="bold">Theo interface/nhóm/floating/quick</text><path marker-end="url(#arrow)" d="M580,240 L580,350" fill="non